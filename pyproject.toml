[project]
name = "minie"
version = "0.1.0"
description = "Wake, speak, act — a Mac voice computer-use agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx>=0.26.0",
    "mlx-whisper>=0.4.3",
    "huggingface-hub>=0.26.0",
    "numpy>=2.0.0",
    "sounddevice>=0.5.1",
    "rumps>=0.4.0",
    "google-genai>=1.40.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
minie = "minie.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
